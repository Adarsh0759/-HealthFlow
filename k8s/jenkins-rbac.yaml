apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: healthflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healthflow-deployer
  namespace: healthflow
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["healthflow"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: healthflow
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: healthflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healthflow-deployer
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: healthflow
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
