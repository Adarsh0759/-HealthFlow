
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthflow-green
  namespace: healthflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthflow
      slot: green
  template:
    metadata:
      labels:
        app: healthflow
        slot: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: healthflow
          image: adarshinfinia/healthflow:green-original-v2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
